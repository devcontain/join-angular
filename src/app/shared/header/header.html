<header class="menu">
    <img src="/assets/images/join-register.png" class="menu-joinlogo-handy" alt="Join Logo">

    <span>Kanban Project Management Tool</span>

    <div class="menu-images">
        <a routerLink="/help" class="menu-help-img">
            <img src="/assets/images/help_icon.png" alt="Help">
        </a>

        <button type="button" class="menu-user" aria-label="Benutzermenü öffnen" [attr.aria-expanded]="menu.menuOpen()"
            (click)="menu.toggleMenu()">
            {{ userInitials() }}
        </button>

        <div id="menu_open"></div>
    </div>
</header>

<main class="add-task">
    <h1>Add Task</h1>

    <form class="add-task-form-section" autocomplete="off">
        <div class="input-wrapper">
            <section class="input-box box-left">
                <div>
                    <div class="required-header">
                        <h3>Title</h3>
                        <h3 style="color: #FF8190;">*</h3>
                    </div>
                    <input class="styled-input focus-blue" placeholder="Enter a title" required type="text"
                        maxlength="35" name="title" [(ngModel)]="title" />
                </div>
                <span class="required-field dnone">This field is required</span>

                <div class="add-task-description">
                    <h3>Description</h3>
                    <div class="textarea-wrapper">
                        <textarea class="textarea focus-blue" placeholder="Enter a Description"
                            name="add_task_description" spellcheck="false"></textarea>
                    </div>
                </div>

                <div class="add-task-assigned-to">
                    <h3>Assigned to</h3>
                    <div class="input-with-button-wrapper">
                        <input class="styled-input focus-blue" placeholder="Select contacts to assign" type="text" />
                        <button type="button" class="dropdown-trigger">
                            <img src="assets/images/arrow_drop_down.png" alt="Select contacts" />
                        </button>
                    </div>
                    <div class="drop-down dnone custom-scrollbar"></div>
                    <div class="selected-contacts"></div>
                </div>
            </section>

            <section class="separator-vertical"></section>

            <section class="input-box box-right">
                <div class="add-task-due-date">
                    <div class="required-header">
                        <h3>Due date</h3>
                        <h3 style="color: #FF8190;">*</h3>
                    </div>
                    <div class="input-with-button-wrapper">
                        <input class="styled-input focus-blue" placeholder="dd/mm/yyyy" type="text" required
                            pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" />
                        <input class="calendar-input" type="date" />
                    </div>
                    <span class="required-field dnone">This field is required</span>
                </div>

                <div class="add-task-prio">
                    <h3>Prio</h3>
                    <div class="prio-buttons">
                        <input id="prio_urgent" class="prio-urgent" name="prio" type="radio" value="urgent" />
                        <label for="prio_urgent">
                            <span>Urgent</span>
                            <img src="assets/images/urgent.svg" alt="" />
                        </label>

                        <input id="prio_medium" class="prio-medium" name="prio" type="radio" value="medium" checked />
                        <label for="prio_medium">
                            <span>Medium</span>
                            <img src="assets/images/medium.svg" alt="" />
                        </label>

                        <input id="prio_low" class="prio-low" name="prio" type="radio" value="low" />
                        <label for="prio_low">
                            <span>Low</span>
                            <img src="assets/images/low.svg" alt="" />
                        </label>
                    </div>
                </div>

                <div class="add-task-category">
                    <div class="required-header">
                        <h3>Category</h3>
                        <h3 style="color: #FF8190;">*</h3>
                    </div>
                    <div class="input-with-button-wrapper">
                        <input class="styled-input focus-blue" placeholder="Select task category" required
                            type="text" />
                        <button type="button" class="dropdown-trigger">
                            <img src="assets/images/arrow_drop_down.png" alt="Select category" />
                        </button>
                    </div>
                    <span class="required-field dnone">This field is required</span>
                    <div class="drop-down dnone"></div>
                </div>

                <div class="add-task-subtask">
                    <h3>Subtask</h3>
                    <div class="input-with-button-wrapper">
                        <input class="styled-input focus-blue" placeholder="Add new subtask" type="text"
                            maxlength="35" />
                        <button type="button" class="add-subtask-button">
                            <img src="assets/images/add.png" alt="Add subtask" />
                        </button>

                        <div class="input-with-double-button dnone">
                            <button type="button" class="clear-subtask-button">
                                <img src="assets/images/cross.svg" alt="Clear" />
                            </button>
                            <div class="separator-vertical"></div>
                            <button type="button" class="confirm-subtask-button">
                                <img src="assets/images/check.svg" alt="Confirm" />
                            </button>
                        </div>
                    </div>
                    <div class="selected-subtasks"></div>
                </div>
            </section>
        </div>

        <section class="bottom-section">
            <div class="bottom-text">
                <span style="color: #FF8190;">*</span>
                <span>This field is required</span>
            </div>

            <div class="bottom-buttons">
                <button class="white-button" type="reset">
                    <span>Clear</span>
                    <img src="assets/images/cross.svg" alt="" />
                </button>

                <button class="blue-button create-task-button" type="submit">
                    <span>Create Task</span>
                    <img src="assets/images/check.png" alt="" />
                </button>
            </div>
        </section>
    </form>

    <div class="task-added-notification">
        <span>Task added to board</span>
        <img src="assets/images/task_added.svg" alt="" />
    </div>
</main>

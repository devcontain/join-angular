<main class="add-task">
    <h1>Add Task</h1>

    <form class="add-task-form-section" autocomplete="off">
        <div class="input-wrapper">
            <section class="input-box box-left">
                <div id="add_task_title">
                    <div class="required-header">
                        <h3>Title</h3>
                        <h3 style="color: #FF8190;">*</h3>
                    </div>
                    <input class="styled-input focus-blue" placeholder="Enter a title" required type="text"
                        id="add_task_title_input" maxlength="35" />
                </div>
                <span class="required-field dnone">This field is required</span>

                <div id="add_task_description">
                    <h3>Description</h3>
                    <div class="textarea-wrapper">
                        <textarea class="focus-blue" placeholder="Enter a Description" name="add_task_description"
                            id="add_task_description_textarea" spellcheck="false"></textarea>
                    </div>
                </div>

                <div id="add_task_assigned_to">
                    <h3>Assigned to</h3>
                    <div class="input-with-button-wrapper">
                        <input class="styled-input focus-blue" placeholder="Select contacts to assign" type="text"
                            id="input_with_button_assigned_to" />
                        <button type="button" class="dropdown-trigger">
                            <img id="drop_down_assigned_to_arrow" src="assets/images/arrow_drop_down.png"
                                alt="Select contacts" />
                        </button>
                    </div>
                    <div class="drop-down dnone custom-scrollbar" id="drop_down_assigned_to"></div>
                    <div id="selected_contacts"></div>
                </div>
            </section>

            <section class="separator-vertical"></section>

            <section class="input-box box-right">
                <div id="add_task_due_date">
                    <div class="required-header">
                        <h3>Due date</h3>
                        <h3 style="color: #FF8190;">*</h3>
                    </div>
                    <div class="input-with-button-wrapper">
                        <input id="input_with_button_date" class="styled-input focus-blue" placeholder="dd/mm/yyyy"
                            type="text" required pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" />
                        <input id="input_calendar" class="calendar-input" type="date" />
                    </div>
                    <span class="required-field dnone">This field is required</span>
                </div>

                <div class="add_task_prio">
                    <h3>Prio</h3>
                    <div id="prio-buttons">
                        <input id="prio_urgent" name="prio" type="radio" value="urgent" />
                        <label id="prio_urgent_label" for="prio_urgent">
                            <span>Urgent</span>
                            <img src="assets/images/urgent.svg" alt="" />
                        </label>

                        <input id="prio_medium" name="prio" type="radio" value="medium" checked />
                        <label id="prio_medium_label" for="prio_medium">
                            <span>Medium</span>
                            <img src="assets/images/medium.svg" alt="" />
                        </label>

                        <input id="prio_low" name="prio" type="radio" value="low" />
                        <label id="prio_low_label" for="prio_low">
                            <span>Low</span>
                            <img src="assets/images/low.svg" alt="" />
                        </label>
                    </div>
                </div>

                <div id="add_task_category">
                    <div class="required-header">
                        <h3>Category</h3>
                        <h3 style="color: #FF8190;">*</h3>
                    </div>
                    <div class="input-with-button-wrapper">
                        <input class="styled-input focus-blue" placeholder="Select task category" required type="text"
                            id="input_with_button_category" />
                        <button type="button" class="dropdown-trigger">
                            <img id="drop_down_category_arrow" src="assets/images/arrow_drop_down.png"
                                alt="Select category" />
                        </button>
                    </div>
                    <span class="required-field dnone">This field is required</span>
                    <div class="drop-down dnone" id="drop_down_category"></div>
                </div>

                <div id="add_task_subtask">
                    <h3>Subtask</h3>
                    <div class="input-with-button-wrapper">
                        <input class="styled-input focus-blue" placeholder="Add new subtask" type="text"
                            id="input_with_button_subtask" maxlength="35" />
                        <button type="button" id="add_subtask_button">
                            <img src="assets/images/add.png" alt="Add subtask" />
                        </button>

                        <div id="confirm_subtask_container" class="input-with-double-button dnone">
                            <button type="button" id="clear_subtask_button">
                                <img src="assets/images/cross.svg" alt="Clear" />
                            </button>
                            <div class="separator-vertical"></div>
                            <button type="button" id="confirm_subtask_button">
                                <img src="assets/images/check.svg" alt="Confirm" />
                            </button>
                        </div>
                    </div>
                    <div id="selected_subtasks"></div>
                </div>
            </section>
        </div>

        <section class="bottom-section">
            <div class="bottom-text" id="required-info">
                <span style="color: #FF8190;">*</span>
                <span>This field is required</span>
            </div>

            <div class="bottom-buttons">
                <button class="white-button" type="reset">
                    <span>Clear</span>
                    <img src="assets/images/cross.svg" alt="" />
                </button>

                <button class="blue-button create-task-button" type="submit">
                    <span>Create Task</span>
                    <img src="assets/images/check.png" alt="" />
                </button>
            </div>
        </section>
    </form>

    <div id="task-added-notification">
        <span>Task added to board</span>
        <img src="assets/images/task_added.svg" alt="" />
    </div>
</main>
